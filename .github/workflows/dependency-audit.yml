name: dependency-audit

# Fail on every unapproved advisory or unavailable/invalid audit report.

on:
  schedule:
    - cron: "23 13 * * 1" # Monday 08:23 EST / 09:23 EDT; after the 06:00 ET Dependabot window
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/audit-ci.mjs"
      - "scripts/test-audit-ci.mjs"
      - ".github/DEPENDENCY-AUDIT.md"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/audit-ci.mjs"
      - "scripts/test-audit-ci.mjs"
      - ".github/DEPENDENCY-AUDIT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Test audit gate
        run: node --test scripts/test-audit-ci.mjs

      - name: Audit gate
        run: node scripts/audit-ci.mjs
